<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب البيتكوين المباشر</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f9; padding: 20px; }
        .price-box { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; }
        h1 { color: #333; }
        #price { font-size: 2em; color: #f7931a; font-weight: bold; }
        .ad-container { margin-top: 20px; }
    </style>
    
    <!-- حط كود Adsterra Popunder هنا (إذا كان عندك) -->
    
</head>
<body>

    <div class="price-box">
        <h1>سعر البيتكوين ₿</h1>
        <div id="price">جاري التحميل...</div>
    </div>

    <!-- كود Adsterra Banner (البانر) غنحطوه هنا -->
    <div class="ad-container">
        <!-- [هنا غنحط الكود ديالك ديال البانر] -->
    </div>

    <script>
        async function getPrice() {
            try {
                const res = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');
                const data = await res.json();
                document.getElementById('price').innerText = data.bitcoin.usd + " $";
            } catch (e) {
                document.getElementById('price').innerText = "خطأ في الاتصال";
            }
        }
        setInterval(getPrice, 10000); // كيتحدث كل 10 ثواني
        getPrice();
    </script>
</body>
</html>
