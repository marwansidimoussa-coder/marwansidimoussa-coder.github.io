<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مروان - مباشر</title>
    <style>
        body { margin: 0; padding: 0; background: #0b0e11; color: white; font-family: sans-serif; }
        /* بلاصة الإعلان الفوق */
        .ad-banner { width: 100%; height: 60px; background: #1a1a1a; display: flex; align-items: center; justify-content: center; border-bottom: 2px solid #f7931a; }
        /* بلاصة الشارت */
        .chart-container { width: 100%; height: calc(100vh - 60px); }
    </style>
</head>
<body>

    <div class="ad-banner">
        <p style="color:#666;">[ضع كود Banner هنا]</p>
    </div>

    <div class="chart-container">
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js">
        {
            "symbol": "BITSTAMP:BTCUSD",
            "interval": "D",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "allow_symbol_change": true,
            "container_id": "tradingview_widget"
        }
        </script>
    </div>

</body>
</html>
