<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب البيتكوين</title>
    <style>
        body { margin: 0; padding: 0; background: #0b0e11; overflow: hidden; }
        /* إطار الإعلان: غايفرض راسو وسط الصفحة */
        .ad-frame { width: 100%; height: 100px; border: none; }
        .chart-container { width: 100%; height: calc(100vh - 100px); }
    </style>
</head>
<body>

    <!-- الإعلان كـ iframe باش يخدم 100% -->
    <iframe class="ad-frame" src="https://www.effectivecpmnetwork.com/rnn398mtfj?key=7006b88308b4048e4019ce852159bc89" scrolling="no" frameborder="0"></iframe>

    <!-- الرسم البياني -->
    <div class="chart-container">
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js">
        { "symbol": "BITSTAMP:BTCUSD", "theme": "dark", "locale": "ar", "allow_symbol_change": true }
        </script>
    </div>

</body>
</html>
