<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب البيتكوين المباشر</title>
    <style>
        body { background: #0b0e11; color: white; font-family: sans-serif; text-align: center; margin: 0; padding: 0; }
        .ad-top { margin: 15px auto; padding: 5px; background: #1e1e1e; border-radius: 8px; max-width: 728px; }
        .chart-container { height: 500px; width: 100%; }
        footer { margin-top: 20px; font-size: 0.8em; color: #555; }
    </style>
</head>
<body>

    <!-- الإعلان ديال Adsterra الفوق -->
    <div class="ad-top">
        <script src="https://pl30367880.effectivecpmnetwork.com/63/33/3d/63333da24fa507d60647cf4605fb7491.js"></script>
    </div>

    <!-- الرسم البياني الاحترافي للبيتكوين -->
    <div class="chart-container">
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js">
        {
            "symbol": "BITSTAMP:BTCUSD",
            "interval": "D",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "allow_symbol_change": true,
            "calendar": true,
            "support_host": "https://www.tradingview.com"
        }
        </script>
    </div>

    <footer>تحديث مباشر للأسعار - منصة مراقبة العملات</footer>

</body>
</html>
