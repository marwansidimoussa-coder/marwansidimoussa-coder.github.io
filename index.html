<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لعبة التداول مروان</title>
    <style>
        body { background: #1a1a1a; color: white; text-align: center; font-family: Arial; padding-top: 50px; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; background: #f7931a; border: none; color: white; border-radius: 10px; }
    </style>
</head>
<body>

    <h1>تحدى نفسك: هل سيرتفع سعر البيتكوين؟</h1>
    <p>اضغط على الزر لتوقع حركة السوق واربح!</p>
    
    <button onclick="playGame()">توقع الارتفاع!</button>
    <p id="result"></p>

    <script>
        function playGame() {
            let win = Math.random() > 0.5;
            document.getElementById("result").innerHTML = win ? "مبروك! توقعك في محله!" : "حظ أوفر، جرب مرة أخرى!";
        }
    </script>

    <!-- كود الإعلان الخاص بك هنا -->
    <script type="text/javascript" src="//www.effectivecpmnetwork.com/rnn398mtfj?key=7006b88308b4048e4019ce852159bc89"></script>

</body>
</html>
