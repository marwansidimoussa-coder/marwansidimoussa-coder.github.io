<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مراقب البيتكوين</title>
    <style>
        body { margin: 0; padding: 0; background: #0b0e11; overflow: hidden; }
        
        /* الإعلان كيبقى مثبت الفوق */
        .ad-container { position: fixed; top: 0; left: 0; width: 100%; height: 90px; z-index: 1000; background: #1e1e1e; }
        
        /* الرسم البياني كيجي تحت الإعلان */
        .chart-container { position: absolute; top: 90px; bottom: 0; width: 100%; }
    </style>
</head>
<body>

    <!-- الإعلان -->
    <div class="ad-container">
        <script type="text/javascript" data-cfasync="false" src="https://pl30367880.effectivecpmnetwork.com/63/33/3d/63333da24fa507d60647cf4605fb7491.js"></script>
    </div>

    <!-- الرسم البياني -->
    <div class="chart-container">
        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js">
        { "symbol": "BITSTAMP:BTCUSD", "theme": "dark", "locale": "ar", "allow_symbol_change": true }
        </script>
    </div>

</body>
</html>
